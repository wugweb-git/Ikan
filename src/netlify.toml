[build]
  command = "mv supabase /tmp/supabase-backup 2>/dev/null || true && npm install --legacy-peer-deps && npm run build && mv /tmp/supabase-backup supabase 2>/dev/null || true"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "mv supabase /tmp/supabase-backup 2>/dev/null || true && npm install --legacy-peer-deps && npm run build && mv /tmp/supabase-backup supabase 2>/dev/null || true"

[context.deploy-preview]
  command = "mv supabase /tmp/supabase-backup 2>/dev/null || true && npm install --legacy-peer-deps && npm run build && mv /tmp/supabase-backup supabase 2>/dev/null || true"