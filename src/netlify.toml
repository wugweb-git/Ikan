[build]
  command = "npm run build"
  publish = "dist"
  ignore = "supabase/**/*"
  
[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm ci --legacy-peer-deps && npm run build"
  ignore = "supabase/**/*"

[context.deploy-preview]
  command = "npm ci --legacy-peer-deps && npm run build"
  ignore = "supabase/**/*"